<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обращения</title>
<script>/* страница работает только внутри общей страницы (index.html) — там вход и данные */

<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e2e5ea;--ac:#2563eb;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;--hd:#e9eef6;--rowh:rgba(37,99,235,.08);
--tn-bg:rgba(226,75,74,.16);--tn:#a32d2d;--tw-bg:rgba(239,159,39,.2);--tw:#854f0b;--td-bg:rgba(29,158,117,.16);--td:#0f6e56;--to:#bfdbfe;--rm:#fed7aa;--dg:#ddd6fe;--gr:#fbcfe8;--eq:#a5f3fc;--sh:#fde68a;--ml:#e2e8f0;--ak:#e9d5b7;--df:#fecdd3;--zc:#d9f99d;--tdb:#ccfbf1;--tdl:#14b8a6;--tdt:#0f5c55;--dr:#cbd5e1;--stx:#1b1f24;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa1ab;--bd:#2d323a;--ac:#6ea0ff;--danger:#f87171;--ok:#4ade80;--warn:#fbbf24;--hd:#2c333f;--rowh:rgba(110,160,255,.10);
--tn-bg:rgba(226,75,74,.24);--tn:#f09595;--tw-bg:rgba(239,159,39,.22);--tw:#efb04f;--td-bg:rgba(29,158,117,.22);--td:#5dcaa5;--to:#1e4274;--rm:#7c3a12;--dg:#4b3a8a;--gr:#7a2a55;--eq:#155e75;--sh:#715a12;--ml:#3f4856;--ak:#5c4527;--df:#7a2333;--zc:#3f5f1a;--tdb:#134e4a;--tdl:#2dd4bf;--tdt:#ccfbf1;--dr:#4b5563;--stx:#f3f4f6;color-scheme:dark}}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.4) transparent}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.65);background-clip:content-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:0 max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
/* страница прокручивается целиком (ползунок от верха до низа экрана), шапка закреплена сверху — как в графике и записи */
.ohdr{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:16px;margin-bottom:10px;border-bottom:1px solid var(--bd)}
@media (min-width:1000px){main{padding-left:20px;padding-right:20px}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
a{color:var(--ac)}
.hrow{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-bottom:12px}
.tswph{flex:none;height:38px;width:284px;opacity:0;pointer-events:auto}
@media (max-width:1499px){.tswph{width:238px}}
@media (max-width:600px){.tswph{width:206px}}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;padding:5px 11px;border-radius:9px;background:transparent;color:var(--mu);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff}
.seg button b{font-weight:700;margin-left:4px;opacity:.85}
.dnav #dToday{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.dnav{display:flex;align-items:center;gap:8px;flex:none}
.dnav .rng{display:flex;align-items:center;gap:2px;position:relative;font-weight:600;white-space:nowrap;min-width:150px;justify-content:center}
.rng .cal{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--mu);border-radius:8px;flex:none}
.rng .cal[hidden]{display:none}
.rng .cal:hover{color:var(--tx);background:var(--bd)}
.rng .dpk{position:absolute;right:0;bottom:0;width:32px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
@media (max-width:600px){.dnav{flex:1 1 100%;gap:6px}.dnav .rng{min-width:0;flex:1;font-size:14px}.dnav button{padding:8px 10px}.dnav .sd{display:none}}
#nB{background:var(--tdb);border-color:var(--tdl);color:var(--tdt);font-weight:600;flex:none}
#nB[hidden]{display:none}
@media (max-width:1799px){#nB .t2{display:none}}
@media (max-width:1499px){#nB .t{display:none}#nB{padding:8px 14px;font-weight:700}}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mu);flex:none;cursor:help}
.dot.g{background:#22c55e}.dot.n{background:var(--mu)}.dot.w{background:#f59e0b}.dot.r{background:var(--danger)}
#menuB{flex:none}#menuB[hidden],#rB[hidden],.dot[hidden]{display:none}
.menu{padding:4px 0 10px;margin-bottom:10px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.menu[hidden]{display:none}
.mlbl{font-size:12px;color:var(--mu);margin:6px 0 6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.rep{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:16px 20px 24px}
.rep[hidden]{display:none}
.rh{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:14px}
.rh h2{font-size:18px;margin:0 6px 0 0}
.rnav{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.rnav[hidden]{display:none}
.rnav input{padding:6px 8px}
.rsp{flex:1}
.kp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kp>div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kp small{display:block;color:var(--mu);font-size:13px}.kp b{font-size:24px;margin-right:6px}.kp i{font-style:normal;font-size:12px;color:var(--mu)}
.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
.sgc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.sgk{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}.sgk svg{width:16px;height:16px}
.sgv{font-size:22px;font-weight:700}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
@media (max-width:600px){.sg{grid-template-columns:1fr 1fr!important}}
.rg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:12px}
.rg2{grid-template-columns:1.6fr 1fr}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;min-width:0}
.rc h3{margin:0 0 10px;font-size:14px}
.rc .none{color:var(--mu);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px}
.bars>div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--mu)}
.bars .bc{width:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:4px 4px 0 0;overflow:hidden;min-height:0}
.bars .bc i{display:block;width:100%}
.bars .bn{font-size:11px;color:var(--tx)}
.bars .bl{white-space:nowrap;overflow:hidden;max-width:100%}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-top:6px}.lg b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.hb>span:first-child{width:130px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.hb .tr{flex:1;height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--ac)}
.hb>b{min-width:64px;text-align:right;font-weight:600;white-space:nowrap}
.rt{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
.rt th,.rt td{padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:visible}
.rt th{color:var(--mu);font-size:12px;text-align:right;background:transparent}.rt th:first-child,.rt td:first-child{text-align:left}.rt td{text-align:right}
.rt tr:last-child td{border-bottom:0}
@media (max-width:1100px){.kp{grid-template-columns:repeat(3,minmax(0,1fr))}.rg,.rg2{grid-template-columns:1fr}}
@media (max-width:600px){.kp{grid-template-columns:1fr 1fr}.rep{padding:12px}}
.qw{position:relative;flex:1 1 140px;max-width:360px;display:flex}
.qw input{width:100%;padding-right:34px}
.qw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:4px 8px;color:var(--mu)}
.uchip{position:relative;flex:none;margin-left:auto}
.uchip>button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;padding-left:10px;padding-right:10px}
@media (max-width:1699px){.uchip .un{display:none}}
.umenu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:230px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.umenu[hidden]{display:none}
.umenu .ur{font-size:12px;color:var(--mu);padding:0 2px 4px}
.umenu button{text-align:left}
#msg{color:var(--mu);padding:30px 0;text-align:center}
.tw{position:relative}
.day{margin-bottom:18px}
/* пустые дни — одной строкой */
.day.dz{margin-bottom:6px}
.dzl{font-size:13px;color:var(--mu);padding:5px 2px;border-bottom:1px dashed var(--bd)}
.dzl b{color:var(--tx);font-weight:600}
.dzl.td b{color:var(--ac)}
.day.dz+.day:not(.dz){margin-top:14px}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:0 2px 8px}
.dh b{font-size:16px}
.dh.td b{color:var(--ac)}
.dh .sub{color:var(--mu);font-size:13px}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto;overflow-y:hidden}
.tc .none{padding:12px 14px;color:var(--mu);font-size:14px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;table-layout:fixed}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;white-space:nowrap}
tr:last-child>td{border-bottom:0}

th{overflow-wrap:normal;hyphens:manual;background:var(--hd);font-size:12px;font-weight:700;color:var(--mu);text-transform:none}
th:not(:last-child),td:not(:last-child){border-right:1px solid var(--bd)}
td.n{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
td.dt{font-variant-numeric:tabular-nums}
td.cm{overflow:hidden}
body[data-lv="1"] th,body[data-lv="1"] td,body[data-lv="2"] th,body[data-lv="2"] td{padding:6px 7px}
body[data-lv="1"] table,body[data-lv="2"] table{font-size:13.5px}
td.cm .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* замер: столбцы по ширине содержимого, комментарий не учитывается */
table.meas{table-layout:auto;width:auto}
table.meas td.cm .c{display:none}table.meas th.cmh,table.meas td.cm{font-size:0;padding:0}
td.mu,.mu{color:var(--mu)}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--rowh)}
tr.r.x td{background:var(--rowh)}
tr.r.due td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.r.nw td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr.r.fl td{animation:fl 1.6s ease-out 1}
@keyframes fl{0%{background:rgba(37,99,235,.35)}100%{background:transparent}}
.ot{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;white-space:nowrap;font-weight:600}
.ot.new{background:var(--tn-bg);color:var(--tn)}
.ot.wip,.ot.later{background:var(--tw-bg);color:var(--tw)}
.ot.done{background:var(--td-bg);color:var(--td)}
tr.dx>td{background:var(--bg);white-space:normal;padding:10px 14px 12px}
.hist{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{padding:5px 10px;font-size:13px}
.acts input,.acts select{padding:5px 8px;font-size:13px}
.acts input{min-width:240px;flex:0 1 340px}
.acts .cb{width:180px;flex:none}.acts .cb input{padding:5px 30px 5px 8px;font-size:13px;min-width:0}.acts .cbl div{font-size:13px}
.seg2{display:inline-flex;border:1px solid var(--bd);border-radius:10px;padding:2px;gap:2px;background:var(--card)}
.seg2 button{border:0;background:transparent;padding:4px 10px;border-radius:8px;color:var(--mu)}
.seg2 button.on{background:var(--ac);color:#fff}
.err{color:var(--danger);font-size:13px;min-height:1em}
.more{margin:10px auto;display:block}
.more[hidden]{display:none}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mh .t{flex:1;font-weight:700;font-size:16px}
.og{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.og .f{display:flex;flex-direction:column;gap:3px}
.og label{font-size:12px;color:var(--mu)}
.og .w3{grid-column:1/-1}
@media (max-width:600px){.og{grid-template-columns:1fr 1fr}}
.ty{display:flex;flex-wrap:wrap;gap:6px}
.tyw{position:relative}
.ty button{padding:6px 10px;font-size:14px}
.ty button.on,.wk{color:var(--stx)}
.wk{display:inline-block;white-space:nowrap;font-size:13px;padding:1px 8px;border-radius:8px}
.on.to,.wk.to{background:var(--to);border-color:var(--to)}.on.rm,.wk.rm{background:var(--rm);border-color:var(--rm)}.on.dg,.wk.dg{background:var(--dg);border-color:var(--dg)}.on.gr,.wk.gr{background:var(--gr);border-color:var(--gr)}
.on.eq,.wk.eq{background:var(--eq);border-color:var(--eq)}.on.sh,.wk.sh{background:var(--sh);border-color:var(--sh)}.on.ml,.wk.ml{background:var(--ml);border-color:var(--ml)}.on.ak,.wk.ak{background:var(--ak);border-color:var(--ak)}.on.df,.wk.df{background:var(--df);border-color:var(--df)}.on.zc,.wk.zc{background:var(--zc);border-color:var(--zc)}.on.dr,.wk.dr{background:var(--dr);border-color:var(--dr)}
.cb{position:relative}.cb input{width:100%;padding-right:34px}.cbs input{cursor:pointer}
.cbb{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:none;background:transparent;padding:4px 8px;color:var(--mu);font-size:14px}
.cbl{position:absolute;left:0;right:0;top:100%;margin-top:3px;max-height:230px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;z-index:30;box-shadow:0 8px 22px rgba(0,0,0,.25);padding:4px 0}
.cbl[hidden]{display:none}
.cbl div{padding:7px 12px;cursor:pointer;font-size:14px}
.cbl div:hover,.cbl div.act{background:var(--bg)}
.cbl div.cur{font-weight:700;color:var(--ac)}
.ph{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg);cursor:text}.ph:focus-within{outline:2px solid var(--ac);outline-offset:-1px}.ph .pre{padding-left:10px;font-weight:600;font-size:16px;color:var(--tx);user-select:all}.ph input{flex:1;min-width:0;border:none!important;background:transparent;outline:none;padding-left:6px}
td a.tel{color:inherit;text-decoration:none}
.dxi{position:sticky;left:14px}
.del{margin-left:auto;color:var(--danger)!important;border-color:var(--danger)!important;background:transparent!important}
.og .w2{grid-column:span 2}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.foot .mu{font-size:13px}
.foot button{margin-left:auto}
.gor[hidden],.gol[hidden],[data-mgo][hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="ohdr" id="ohdr">
<div class="hrow">
<h1 class="vh">Обращения клиентов</h1>
<div class="tswph" aria-hidden="true"></div><span id="syncDot" class="dot n" role="img" title="" aria-label=""></span><button type="button" id="menuB" aria-expanded="false" aria-controls="menu" hidden>☰ Меню ▸</button>
<div class="seg" id="flt" role="group" aria-label="Какие обращения показать"></div>
<div class="dnav" role="group" aria-label="День"><button type="button" id="dPrev" aria-label="Предыдущий день">‹</button><div class="rng"><span id="dL"></span><button type="button" id="calB" class="cal" aria-label="Выбрать дату" title="Выбрать дату"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg></button><input type="date" id="dPick" class="dpk" tabindex="-1" aria-hidden="true"></div><button type="button" id="dNext" aria-label="Следующий день">›</button><button type="button" id="dToday">Сегодня</button></div>
<div class="qw"><input type="text" id="q" placeholder="Поиск: №, имя, телефон, марка, причина…" autocomplete="off" aria-label="Поиск по обращениям"><button type="button" id="qX" aria-label="Очистить поиск" hidden>✕</button></div>
<button type="button" id="nB" aria-label="Новое обращение" title="Новое обращение" hidden>+<span class="t"><span class="t2"> Новое</span> обращение</span></button>
<div class="uchip" id="uChip" hidden><button type="button" id="uB" aria-haspopup="true" aria-expanded="false"></button><div class="umenu" id="uMenu" hidden><div class="ur" id="uRole"></div><button type="button" id="uPw">Сменить мой пароль</button><button type="button" id="uOut">Выйти</button></div></div>
</div>
<div id="menu" class="menu" hidden><div class="mlbl gol">Общее</div><div class="tools gor"><button type="button" data-mgo="grafik:s" data-need="any">Сотрудники и посты ↗</button><button type="button" data-mgo="grafik:m" data-need="set">Режим работы ↗</button><button type="button" data-mgo="zapis:u" data-need="owner">Пользователи ↗</button><button type="button" data-mgo="zapis:g" data-need="any">Синхронизация GitHub ↗</button></div><div class="mlbl gol">График смен</div><div class="tools gor"><button type="button" data-mgo="grafik:b" data-need="graf">Режимы корректировки ↗</button><button type="button" data-mgo="grafik:exp" data-need="any">Скачать график ↗</button></div><div class="mlbl">Обращения</div><div class="tools"><button type="button" id="rB" hidden>Отчёт по обращениям</button></div><div class="mlbl gol">Запись на сервис</div><div class="tools gor"><button type="button" data-mgo="zapis:ms" data-need="tpl">Шаблоны сообщений ↗</button><button type="button" data-mgo="zapis:ld" data-need="load">Отчёт загрузки цеха ↗</button><button type="button" data-mgo="zapis:zr" data-need="zrep">Отчёт по записям ↗</button></div></div>
</div>
<div id="msg">Загрузка…</div>
<div class="tw" id="tw" hidden><div id="tb"></div><button type="button" class="more" id="more" hidden>Показать ещё</button></div>
</main>
<div id="rep" class="rep" role="dialog" aria-modal="true" aria-labelledby="rT" hidden>
<div class="rh"><h2 id="rT">Отчёт по обращениям</h2>
<div class="seg" id="rPer" role="group" aria-label="Период"><button type="button" data-p="day">Сегодня</button><button type="button" data-p="week" class="on">Неделя</button><button type="button" data-p="month">Месяц</button><button type="button" data-p="cust">Свой период</button></div>

<span class="rsp"></span><button type="button" id="rCsv">Скачать в Excel</button><button type="button" id="rX" aria-label="Закрыть отчёт">✕</button></div>
<div id="rBody"></div>
</div>

<dialog id="nd" aria-labelledby="ndT"><div class="dlg">
<div class="mh"><div class="t" id="ndT">Новое обращение</div><button type="button" id="ndX" aria-label="Закрыть">✕</button></div>
<form class="og" id="nF" autocomplete="off" onsubmit="return false">
<div class="f"><label for="nWay">Способ</label><select id="nWay"></select></div>

<div class="f"><label for="nBrand">Марка</label><div class="cb"><input type="text" id="nBrand" name="ob-br-x" maxlength="30" placeholder="Hyundai" autocomplete="off" role="combobox" aria-expanded="false"><button type="button" class="cbb" tabindex="-1" aria-label="Показать список марок">▾</button><div class="cbl" role="listbox" hidden></div></div></div>
<div class="f"><label for="nModel">Модель</label><div class="cb"><input type="text" id="nModel" name="ob-md-x" maxlength="40" placeholder="Tucson" autocomplete="off" role="combobox" aria-expanded="false"><button type="button" class="cbb" tabindex="-1" aria-label="Показать список моделей">▾</button><div class="cbl" role="listbox" hidden></div></div></div>

</form>
<div class="err" id="nErr"></div>
<div class="foot"><span class="mu" id="nWho"></span><button type="button" class="pri" id="nSend">Сохранить</button></div>
</div></dialog>

<script>
/* Вкладка «Обращения»: вся таблица обращений клиентов. Данные хранятся вместе с записью (zapis.json),
   поэтому всё чтение и изменение идёт через вкладку записи (zApi.ob). */
function Z(){try{var w=parent.document.getElementById('fz').contentWindow;return w&&w.zApi&&w.zApi.ob||null}catch(e){return null}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function digits(s){return String(s||'').replace(/\D/g,'')}
function dt(t){var d=new Date(t),y=new Date().getFullYear();return pad(d.getDate())+'.'+pad(d.getMonth()+1)+(d.getFullYear()!==y?'.'+String(d.getFullYear()).slice(2):'')+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function hm(t){var d=new Date(t),td=new Date();return (d.toDateString()===td.toDateString()?'':pad(d.getDate())+'.'+pad(d.getMonth()+1)+' ')+pad(d.getHours())+':'+pad(d.getMinutes())}
function dur(a,b){var m=Math.max(0,Math.round((b-a)/60000));if(m<60)return m+' мин';var h=Math.floor(m/60);if(h<24)return h+' ч'+(m%60?' '+m%60+' мин':'');return Math.floor(h/24)+' дн'+(h%24?' '+h%24+' ч':'')}
var RES={book:'Записан',cons:'Проконсультирован',other:'Другое'};
var day=null,span=14,oldest=null,goDay=null,spyOff=0,flt='all',q='',exp=null,arm=null,lim=200,flash=null,lastSig='',err='';
try{flt=localStorage.getItem('obr-flt')||'all'}catch(e){}
var TYK={},delArm=null;

function tag(o){if(o.st==='done')return '<span class="ot done">'+(RES[o.res]||'Закрыто')+'</span>';var nr=(o.tries||[]).filter(function(x){return x.k==='wip'||x.nr}).length;if(o.st==='later')return '<span class="ot later">'+(nr?'Недозвон ×'+nr+' · п':'П')+'ерезвонить '+hm(o.later)+'</span>';if(o.st==='wip')return '<span class="ot wip">Недозвон ×'+nr+'</span>';return '<span class="ot new">Новое</span>'}
/* что видит сотрудник: владелец и «видеть все» — всё; кто отрабатывает — все открытые и закрытые с его участием; кто только создаёт — свои */
/* «Все» и «Открытые» — все обращения; «Закрытые» — свои (кто принял, вёл или закрыл); владельцу и «видеть все» — все закрытые */
function visible(o,f,me){return true}
function myDone(o,f,me){return me.owner||f.view||o.resp===me.id||o.cb===me.id||o.byU===me.id}
function mine(o,f,me){return f.work?(o.st!=='done'&&(o.resp===me.id||!o.resp)):o.byU===me.id}
function filters(f,me){var r=[['all','Все'],['open','Открытые']];if(!me||me.role!=='atz')r.push(['done','Закрытые']);return r}
function match(o,s){if(!s)return true;var d=digits(s);if(d&&d.length>=3&&digits(o.phone).indexOf(d)>=0)return true;if(/^\d+$/.test(s)&&String(o.n)===s)return true;
  return [o.client,o.brand,o.model,o.year,o.why,o.desc,o.by,o.respName,o.way,o.note,o.cbName].join(' ').toLowerCase().indexOf(s.toLowerCase())>=0}

/* область даты: «Все дни» или конкретный день (по дате создания обращения); поиск всегда идёт по всем дням */
var DNS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],MNS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function isoOf(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addD(iso,n){var q=iso.split('-'),d=new Date(+q[0],+q[1]-1,+q[2]+n);return isoOf(d.getTime())}
var DNL=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],MNL=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function dObj(iso){var q=iso.split('-');return new Date(+q[0],+q[1]-1,+q[2])}
function dLabel(){var td=isoOf(Date.now()),d=dObj(day);$('dNext').disabled=day>=td;$('dL').innerHTML=DNS[d.getDay()]+', '+d.getDate()+' '+MNS[d.getMonth()]+' '+d.getFullYear()+(day===td?'<span class="sd"> · сегодня</span>':'')}
/* ширина столбцов — по самому длинному содержимому во всех днях (одинаковая во всех таблицах); всё, что осталось, отдаётся комментарию.
   Не помещается — комментарий сжимается, полный текст во всплывающей подсказке */
function fitCols(){var T=[].slice.call(document.querySelectorAll('#tb table'));if(!T.length)return;var W=[],ci=-1;
  T.forEach(function(t){t.classList.add('meas');t.style.minWidth='';[].forEach.call(t.querySelectorAll('col'),function(c){c.style.width=''})});
  T.forEach(function(t){[].forEach.call(t.tHead.rows[0].cells,function(c,i){if(c.classList.contains('cmh')){ci=i;return}var w=c.getBoundingClientRect().width;if(!(W[i]>=w))W[i]=Math.ceil(w)})});
  T.forEach(function(t){t.classList.remove('meas');[].forEach.call(t.querySelectorAll('col'),function(c,i){c.style.width=i===ci?'':(W[i]||0)+'px'})});
  var sum=W.reduce(function(a,b){return a+(b||0)},0),tw=T[0].parentNode.clientWidth;T.forEach(function(t){t.style.minWidth=(sum+120)+'px'});
  [].forEach.call(document.querySelectorAll('#tb td.cm .c'),function(d){if(d.scrollWidth>d.clientWidth+1)d.title=d.dataset.full;else d.removeAttribute('title')})}
function render(){var z=Z();
  if(!z||!z.ok()){$('msg').hidden=false;$('msg').textContent=z?'Войдите во вкладке «Запись».':'Загрузка…';$('tw').hidden=true;$('uChip').hidden=true;$('nB').hidden=true;$('flt').innerHTML='';return}
  var f=z.f(),me=z.me(),L=z.list().filter(function(o){return visible(o,f,me)}),now=Date.now();if(!day)day=isoOf(now);dLabel();
  if(!(f.tab||me.owner)){$('msg').hidden=false;$('msg').textContent='Обращения вам пока не открыты.';$('tw').hidden=true;return}
  // шапка
  var FL=filters(f,me);if(!FL.some(function(x){return x[0]===flt}))flt='all';
  var cnt={open:L.filter(function(o){return o.st!=='done'}).length};try{(Z().lists().obTypes||Z().lists().types||[]).forEach(function(t){TYK[t.k]=1})}catch(x){}
  $('flt').innerHTML=FL.map(function(x){return '<button type="button" data-f="'+x[0]+'" class="'+(flt===x[0]?'on':'')+'" aria-pressed="'+(flt===x[0])+'">'+x[1]+(cnt[x[0]]?'<b>'+cnt[x[0]]+'</b>':'')+'</button>'}).join('');
  $('nB').hidden=!f.add;$('rB').hidden=!f.rep;if(rOpen){if(f.rep)renderRep();else closeRep()}
  $('uChip').hidden=false;$('uB').innerHTML='👤<span class="un"> '+esc(me.name)+'</span> ▾';$('uB').title=me.name;$('uRole').textContent=me.name+' · '+me.roleName;
  // строки
  var list=L.filter(function(o){if(flt==='open')return o.st!=='done';if(flt==='done')return o.st==='done'&&myDone(o,f,me);if(flt==='mine')return mine(o,f,me);return true}).filter(function(o){return match(o,q.trim())});
  list.sort(function(a,b){return (b.n||0)-(a.n||0)||b.t-a.t});
  var srch=!!q.trim();$('msg').hidden=!(srch&&!list.length);$('tw').hidden=srch&&!list.length;if(srch&&!list.length){$('msg').textContent='Ничего не найдено.';return}
  /* таблица подстраивается под ширину экрана: на ноутбуке часть столбцов объединяется, чтобы всё помещалось без прокрутки вбок */
  var W=document.documentElement.clientWidth,lv=W>=1600?0:W>=1250?1:2;document.body.dataset.lv=lv;
  var nc=f.nocli,np=f.noph,C=[];
  function col(hd,cl,fn,w){C.push({h:hd,c:cl,f:fn,w:w})}
  function telH(o){var ph=digits(o.phone);return ph.length>=10?'<a class="tel" href="tel:+7'+ph.slice(-10)+'" data-tel>'+esc(o.phone)+'</a>':esc(o.phone)}
  function car(o){return esc([o.brand,o.model].filter(Boolean).join(' '))+(o.year?' <span class="mu">'+esc(o.year)+'</span>':'')}
  col('№','n',function(o){return o.n||''},[46,42,38][lv]);
  if(lv===0){col('Принято','dt',function(o){return dt(o.t).split(' ')[1]},104);col('Способ','',function(o){return esc(o.way)},104)}
  else col('Принято','dt',function(o){return dt(o.t).split(' ')[1]+(lv===2?'<br><span class="mu">'+esc(o.way)+'</span>':'')},lv===2?96:64);
  if(lv===1)col('Способ','w',function(o){return esc(o.way)},96);
  col('Ответ&shy;ственный','w',function(o){return o.resp?esc(o.respName):'<span class="mu">—</span>'},[130,110,100][lv]);
  if(lv===0){col('Марка','',function(o){return esc(o.brand)},110);col('Модель','',function(o){return esc(o.model)},130);col('Год','',function(o){return esc(o.year||'')},60)}
  else col('Автомобиль','w',car,lv===1?150:124);
  if(lv<2){if(!nc)col('Клиент','w',function(o){return esc(o.client)},lv?130:160);if(!np)col('Телефон','',telH,lv?136:146)}
  else if(!nc||!np)col(nc?'Телефон':'Клиент','w',function(o){return (nc?'':esc(o.client))+(!nc&&!np&&o.client&&o.phone?'<br>':'')+(np?'':telH(o))},140);
  function whyT(o){return o.why==='Дополнительное оборудование'?'Доп. оборудование':o.why}
  col('Причина','',function(o){return o.why?(TYK[o.wk]?'<span class="wk '+o.wk+'">'+esc(whyT(o))+'</span>':esc(whyT(o))):''},[176,164,150][lv]);
  col('Комментарий','cm',function(o){return '<div class="c" data-full="'+esc(o.desc)+'">'+esc(o.desc)+'</div>'});
  function tm(o){return o.st!=='done'?dur(o.t,now):dur(o.t,o.ct)}
  if(lv<2){col('Статус','',tag,lv?132:150);col('Время','mu',tm,lv?84:96)}else col('Статус','',function(o){return tag(o)+'<div class="mu" style="font-size:12px;margin-top:3px">'+tm(o)+'</div>'},124);
  var colg='<colgroup>'+C.map(function(){return '<col>'}).join('')+'</colgroup>',thd='<thead><tr>'+C.map(function(c){return '<th scope="col"'+(c.c==='cm'?' class="cmh"':'')+'>'+c.h+'</th>'}).join('')+'</tr></thead>';
  /* по дням, как в записи: сверху сегодня, ниже прошлые дни; выбранный день показывается всегда, даже если он пустой */
  /* дни идут подряд, как в записи: от сегодня назад, пустые дни тоже видны; при прокрутке вниз подгружаются более ранние */
  var by={},td=isoOf(now),days=[];list.forEach(function(o){var k=isoOf(o.t);(by[k]=by[k]||[]).push(o)});
  if(srch)days=Object.keys(by).sort().reverse();
  else{if(day>td)day=td;var lo=addD(td,-span);if(day<lo){span=Math.round((dObj(td)-dObj(day))/864e5)+3;lo=addD(td,-span)}
    oldest=list.reduce(function(m,o){var k=isoOf(o.t);return k<m?k:m},td);for(var k=td;k>=lo;k=addD(k,-1)){days.push(k);by[k]=by[k]||[]}}
  var all={};L.forEach(function(o){var k=isoOf(o.t);all[k]=all[k]||[0,0];all[k][0]++;if(o.st!=='done')all[k][1]++});
  var h='';days.forEach(function(k){var d=dObj(k),rows=by[k],a=all[k]||[0,0];
    if(!rows.length){h+='<section class="day dz" data-d="'+k+'"><div class="dzl'+(k===td?' td':'')+'"><b>'+DNS[d.getDay()]+', '+d.getDate()+' '+MNL[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')+(k===td?' · сегодня':'')+'</b> — '+(flt==='open'?'открытых обращений нет':flt==='done'?'закрытых обращений нет':'обращений нет')+'</div></section>';return}
    h+='<section class="day" data-d="'+k+'"><div class="dh'+(k===td?' td':'')+'"><b>'+DNL[d.getDay()]+', '+d.getDate()+' '+MNL[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')+(k===td?' · сегодня':'')+'</b><span class="sub">Обращений: '+a[0]+(a[1]?' · открытых: '+a[1]:'')+'</span></div><div class="tc">';
    h+='<table>'+colg+thd+'<tbody>';
    rows.forEach(function(o){var open=o.st!=='done',due=o.st==='later'&&o.later<=now,cls='r'+(exp===o.id?' x':'')+(open&&o.st==='new'?' nw':'')+(due?' due':'')+(flash===o.id?' fl':'');
      h+='<tr class="'+cls+'" data-id="'+o.id+'" tabindex="0" aria-expanded="'+(exp===o.id)+'">'+C.map(function(c){return '<td'+(c.c?' class="'+c.c+'"':'')+'>'+c.f(o)+'</td>'}).join('')+'</tr>';
      if(exp===o.id)h+='<tr class="dx"><td colspan="'+C.length+'"><div class="dxi">'+detail(o,f)+'</div></td></tr>'});
    h+='</tbody></table></div></section>'});
  var st0=scrollY;$('tb').innerHTML=h;var ls=$('tb').lastElementChild;$('tb').style.paddingBottom=ls?Math.max(0,innerHeight-$('ohdr').offsetHeight-ls.offsetHeight-24)+'px':'';scrollTo(0,st0);flash=null;
  if(goDay){var sec=document.querySelector('#tb .day[data-d="'+goDay+'"]');goDay=null;if(sec){spyOff=Date.now();scrollTo(0,twTop()+sec.offsetTop-$('ohdr').offsetHeight)}}
  fitCols();
  var dxi=document.querySelector('#tb .dxi');if(dxi)dxi.style.width=Math.max(260,dxi.closest('.tc').clientWidth-30)+'px';
  $('more').hidden=true;
  if($('lSel'))enhanceSelect('lSel');
  if(arm){var ci=document.querySelector('#tb [data-c]');if(ci&&!ci.dataset.f){ci.dataset.f=1;ci.focus()}}}

var LATER=(function(){var h='';for(var m=30;m<=300;m+=30){var hh=Math.floor(m/60),mm=m%60;h+='<option value="'+m+'"'+(m===60?' selected':'')+'>через '+(hh?hh+' ч':'')+(hh&&mm?' ':'')+(mm?mm+' мин':'')+'</option>'}return h+'<option value="t10">завтра</option>'})();
function detail(o,f){var h='<div class="hist">';
  h+='<div>Создал: '+esc(o.by||'—')+' · '+dt(o.t)+'</div>';
  (o.tries||[]).forEach(function(x){h+='<div>'+(x.k==='later'?(x.nr?'Не дозвонились, перезвонить ':'Перезвонить ')+hm(x.at):'Недозвон')+' · '+hm(x.t)+' · '+esc(x.n||'')+(x.c?' — '+esc(x.c):'')+'</div>'});
  if(o.st==='done')h+='<div><b>'+(RES[o.res]||'Закрыто')+'</b> · '+esc(o.cbName)+' · '+dt(o.ct)+(o.note?' — '+esc(o.note):'')+(o.bkLive?' · <a href="#" data-bk="'+o.bk+'">открыть запись</a>':'')+'</div>';
  h+='</div>';
  if(o.canAct){
    if(arm&&arm.id===o.id){var k=arm.k;h+='<div class="acts">'+(k==='later'?'<div class="seg2" role="group" aria-label="Почему перезвонить"><button type="button" data-nr="1" class="'+(arm.nr?'on':'')+'">Не дозвонились</button><button type="button" data-nr="0" class="'+(arm.nr?'':'on')+'">Клиент попросил</button></div><label class="vh" for="lSel">Когда перезвонить</label><select id="lSel" data-l>'+LATER+'</select>':'')
      +'<input type="text" data-c maxlength="200" aria-label="Комментарий" placeholder="'+(k==='other'?'Что сделали (обязательно)':'Комментарий')+'"><button type="button" class="pri" data-ok="'+o.id+'">'+(k==='later'?'Сохранить':'Закрыть обращение')+'</button><button type="button" data-no>Отмена</button></div>'}
    else h+='<div class="acts">'+(f.book?'<button type="button" class="pri" data-a="book">Записать</button>':'')+'<button type="button" data-a="cons">Проконсультирован</button><button type="button" data-a="later">Перезвонить</button><button type="button" data-a="other">Другое</button></div>'}
  else if(o.st!=='done'&&f.work)h+='<div class="mu" style="font-size:13px">Обращение ведёт '+esc(o.respName)+'.</div>';
  var me=Z()&&Z().me();if(me&&me.owner&&f.write)h+=delArm===o.id?'<div class="acts" style="margin-top:8px;justify-content:flex-end"><span>Удалить обращение № '+(o.n||'')+'? Восстановить будет нельзя.</span><button type="button" class="del" style="margin-left:0" data-delok>Да, удалить</button><button type="button" data-delno>Отмена</button></div>':'<div class="acts" style="margin-top:8px"><button type="button" class="del" data-del>Удалить обращение</button></div>';
  if(err)h+='<div class="err">'+esc(err)+'</div>';
  return h}

function goto(d){day=d;goDay=d;exp=null;arm=null;render()}
$('dPrev').onclick=function(){goto(addD(day||isoOf(Date.now()),-1))};
$('dNext').onclick=function(){var t=isoOf(Date.now());if(day<t)goto(addD(day,1))};
$('dToday').onclick=function(){goto(isoOf(Date.now()))};
$('dPick').onchange=function(){if(this.value)goto(this.value)};
/* при прокрутке в надписи даты — день, который сейчас вверху таблицы */
