<style>
:root{color-scheme:light dark}
html,body{margin:0;height:100%;overflow:hidden;background:#f6f7f9}
@media (prefers-color-scheme:dark){html,body{background:#14161a}}
iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:block;background:transparent}
iframe.off{visibility:hidden;pointer-events:none;z-index:-1}
/* переключатель разделов: стоит на месте, пока страницы под ним сдвигаются */
:root{--card:#fff;--bd:#e2e5ea;--tx:#1b1f24;--ac:#2563eb;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--card:#1d2026;--bd:#2d323a;--tx:#eceef1;--ac:#6ea0ff;--danger:#f87171}}
.tsw{position:fixed;z-index:10;display:flex;align-items:center;gap:6px;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);transition:left .2s,top .2s}
.tsw[hidden]{display:none}
.tsw .tar{position:relative;width:38px;height:38px;padding:0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;font-family:inherit}
.tsw .tar:hover{background:var(--bd)}.tsw .tar:active{transform:scale(.92)}
.tsw .tar[hidden]{display:none}
.tsw .twc{position:relative}
.tsw .twin{position:relative;height:38px;width:196px;overflow:hidden;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
.tsw .tlb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;white-space:nowrap}
.tsw .tdots{position:absolute;left:0;right:0;top:100%;margin-top:2px;display:flex;gap:4px;justify-content:center}
.tsw .tdots i{width:5px;height:4px;border-radius:2px;background:var(--bd);transition:all .3s}.tsw .tdots i.on{width:14px;background:var(--ac)}
.tsw .obc{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:12px;line-height:18px;text-align:center;font-weight:600}
.tsw .obc:empty{display:none}
.tsw .tar .obc{position:absolute;top:-6px;right:-6px;min-width:16px;padding:0 4px;font-size:11px;font-weight:700;line-height:16px}
@media (max-width:1499px){.tsw .twin{width:150px}}
@media (max-width:600px){.tsw .twin{width:126px}.tsw .tlb{font-size:14px}.tsw .tar{width:34px}}
</style>
</head>
<body>
<nav class="tsw" id="tsw" aria-label="Разделы" hidden><button type="button" class="tar" data-dir="-1">‹<span class="obc"></span></button><div class="twc"><div class="twin" id="twin"></div><div class="tdots" id="tdots" aria-hidden="true"></div></div><button type="button" class="tar" data-dir="1">›<span class="obc"></span></button></nav>
<iframe allow="clipboard-write" id="fg" title="График смен"></iframe>
<iframe allow="clipboard-write" id="fo" title="Обращения" class="off"></iframe>
<iframe allow="clipboard-write" id="fz" title="Запись на сервис" class="off"></iframe>
<script>
/* Общая страница: три вкладки — «График смен» (grafik.html), «Обращения» (obr.html) и «Запись на сервис» (zapis.html).
   Обе страницы загружены сразу, переключение без перезагрузки. */
/* вкладки всегда грузятся свежими: без этого браузер может показывать старую версию графика или записи из кэша */
var V=Date.now();document.getElementById('fg').src='grafik.html?v='+V;document.getElementById('fz').src='zapis.html?v='+V;document.getElementById('fo').src='obr.html?v='+V;
var TABS={grafik:{f:'fg',t:'График смен',i:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3QgeD0iNSIgeT0iNSIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiByeD0iNC41IiBmaWxsPSIjNjBhNWZhIi8+PHJlY3QgeD0iMjQiIHk9IjUiIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgcng9IjQuNSIgZmlsbD0iIzQ3NTU2OSIvPjxyZWN0IHg9IjQzIiB5PSI1IiB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHJ4PSI0LjUiIGZpbGw9IiM0NzU1NjkiLz48cmVjdCB4PSI1IiB5PSIyNCIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiByeD0iNC41IiBmaWxsPSIjNDc1NTY5Ii8+PHJlY3QgeD0iMjQiIHk9IjI0IiB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHJ4PSI0LjUiIGZpbGw9IiM2MGE1ZmEiLz48cmVjdCB4PSI0MyIgeT0iMjQiIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgcng9IjQuNSIgZmlsbD0iI2ZiYmYyNCIvPjxyZWN0IHg9IjUiIHk9IjQzIiB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHJ4PSI0LjUiIGZpbGw9IiNmYmJmMjQiLz48cmVjdCB4PSIyNCIgeT0iNDMiIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgcng9IjQuNSIgZmlsbD0iIzQ3NTU2OSIvPjxyZWN0IHg9IjQzIiB5PSI0MyIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiByeD0iNC41IiBmaWxsPSIjNjBhNWZhIi8+PC9zdmc+'},obr:{f:'fo',t:'Обращения',i:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3QgeD0iMSIgeT0iMSIgd2lkdGg9IjYyIiBoZWlnaHQ9IjYyIiByeD0iMTIiIGZpbGw9IiMzNzQxNTEiLz48cGF0aCBkPSJNMjAgMTRjMi0xIDQgMCA1IDJsNCA4YzEgMiAwIDQtMSA1bC0zIDNjMiA1IDYgOSAxMSAxMWwzLTNjMS0xIDMtMiA1LTFsOCA0YzIgMSAzIDMgMiA1bC0yIDVjLTEgMi0zIDMtNSAzQzI5IDU2IDggMzUgOSAxN2MwLTIgMS00IDMtNXoiIGZpbGw9IiNmYmJmMjQiLz48L3N2Zz4='},zapis:{f:'fz',t:'Запись на сервис',i:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3QgeD0iMSIgeT0iNyIgd2lkdGg9IjYyIiBoZWlnaHQ9IjU2IiByeD0iOSIgZmlsbD0iIzM3NDE1MSIvPjxwYXRoIGQ9Ik0xIDE2IGE5IDkgMCAwIDEgOSAtOSBoNDQgYTkgOSAwIDAgMSA5IDkgdjggaC02MiB6IiBmaWxsPSIjNjBhNWZhIi8+PHJlY3QgeD0iMTMiIHk9IjEiIHdpZHRoPSI3IiBoZWlnaHQ9IjEzIiByeD0iMy41IiBmaWxsPSIjOTRhM2I4Ii8+PHJlY3QgeD0iNDQiIHk9IjEiIHdpZHRoPSI3IiBoZWlnaHQ9IjEzIiByeD0iMy41IiBmaWxsPSIjOTRhM2I4Ii8+PGcgdHJhbnNmb3JtPSJyb3RhdGUoLTQ1IDMyIDQzKSI+PHJlY3QgeD0iMjcuNSIgeT0iMzAiIHdpZ /* смена вкладки со сдвигом: старая страница уезжает в сторону стрелки, новая въезжает с другой стороны */
var ORD=['grafik','obr','zapis'],ANI=[];
function showTab(k,d){if(!TABS[k])k='grafik';var first=cur===null;if(k===cur)return;var prev=cur;cur=k;
  ANI.forEach(function(a){try{a.finish()}catch(e){}});ANI=[];
  var red=false;try{red=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  if(!d)d=ORD.indexOf(k)>ORD.indexOf(prev)?1:-1;
  var fo=prev&&document.getElementById(TABS[prev].f),fn=document.getElementById(TABS[k].f);
  for(var n in TABS){var f=document.getElementById(TABS[n].f);if(n!==k&&n!==prev)f.classList.add('off');f.setAttribute('aria-hidden',n!==k?'true':'false')}
  fn.classList.remove('off');
  if(first||!fo||red||!fn.animate){if(fo)fo.classList.add('off')}
  else{var o={duration:350,easing:'cubic-bezier(.4,0,.2,1)'};fo.style.zIndex=1;fn.style.zIndex=2;
    var a1=fo.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX('+(-30*d)+'%)',opacity:0}],o),a2=fn.animate([{transform:'translateX('+(30*d)+'%)',opacity:0},{transform:'translateX(0)',opacity:1}],o);ANI=[a1,a2];
    a1.onfinish=function(){if(cur!==prev)fo.classList.add('off');fo.style.zIndex=fn.style.zIndex=''};}
  if(window.SW)swLabel(prev,k,first||red?0:d);
  document.title=TABS[k].t;
  try{history.replaceState(null,'','#'+k)}catch(e){location.hash=k}
  try{localStorage.setItem('shell-tab',k)}catch(e){}
  var w=document.getElementById(TABS[k].f).contentWindow;
  if(!first){try{w.focus()}catch(e){}try{if(w.tabShown)w.tabShown()}catch(e){}}
}
var h=(location.hash||'').replace('#',''),st='';try{st=localStorage.getItem('shell-tab')||''}catch(e){}
showTab(TABS[h]?h:(TABS[st]?st:'grafik'));
/* один вход: пока никто не вошёл, показываем экран входа (он во вкладке записи), после входа возвращаем выбранную вкладку */
var want=null;
function authSt(){try{var w=document.getElementById('fz').contentWindow;return w&&w.authState?w.authState():''}catch(e){return ''}}
function perm(){try{var w=document.getElementById('fz').contentWindow;return (w&&w.permFor&&w.permFor())||{}}catch(e){return {}}}
/* какие вкладки открыты сотруднику — настраивает владелец в «Доступе к функциям» */
function okTab(k){var p=perm();return k==='grafik'?p.tg!==false:k==='obr'?!!p.ob:p.tz!==false}
function firstTab(){return ['grafik','obr','zapis'].filter(okTab)[0]||'zapis'}
var _show=showTab;window.tabGo=function(k,d){showTab(k,d)};showTab=function(k,d){var a=authSt();if(k!=='zapis'&&a==='out'){want=k;k='zapis'}else if(a==='in'&&!okTab(k))k=firstTab();else if(k==='zapis'&&cur!=='zapis'&&want)want=null;_show(k,d)};
/* у вкладок прячем недоступные; рядом с «Обращениями» — число открытых */
var vis=null;
function obUpd(){var a=authSt(),p=a==='in'?perm():{},on=a==='in'&&!!p.ob,ng=a==='in'&&p.tg===false,nz=a==='in'&&p.tz===false,n='';if(on){try{var z=document.getElementById('fz').contentWindow.zApi.ob;n=z.count()||''}catch(e){}}
  var key=[on,ng,nz,n].join('|');if(key===vis)return;vis=key;['fg','fo','fz'].forEach(function(id){try{var d=document.getElementById(id).contentDocument;if(!d||!d.documentElement)return;var c=d.documentElement.classList;c.toggle('obr-on',on);c.toggle('no-tg',ng);c.toggle('no-tz',nz);0}catch(e){}})}
['fg','fo','fz'].forEach(function(id){document.getElementById(id).addEventListener('load',function(){vis=null;obUpd()})});
setInterval(function(){var a=authSt();obUpd();if(a==='out'&&cur!=='zapis'){want=cur;_show('zapis')}else if(a==='in'&&want){var t=want;want=null;showTab(t)}else if(a==='in'&&!okTab(cur))_show(firstTab())},400);

/* ===== переключатель разделов ===== */
var NM={grafik:['График смен','График'],obr:['Обращения','Обращения'],zapis:['Запись на сервис','Запись']},SW=document.getElementById('tsw'),obCnt='';
function swList(){return ORD.filter(function(k){return k===cur||authSt()!=='in'||okTab(k)})}
/* разделы идут по порядку, без круга: за крайним дальше не листается */
function swNb(d){var L=swList(),i=L.indexOf(cur);return L[i+d]||null}
function swLbHtml(k){return NM[k][innerWidth<1500?1:0]+(k==='obr'?'<span class="obc">'+obCnt+'</span>':'')}
function swLabel(a,b,d){var w=document.getElementById('twin');if(!w)return;var o=w.lastElementChild;w.insertAdjacentHTML('beforeend','<div class="tlb">'+swLbHtml(b)+'</div>');var nl=w.lastElementChild;
  if(!d||!o||!nl.animate){while(w.children.length>1)w.firstElementChild.remove();swUpd();return}
  var op={duration:350,easing:'cubic-bezier(.4,0,.2,1)'};var a1=o.animate([{transform:'none'},{transform:'translateX('+(-100*d)+'%)'}],op);nl.animate([{transform:'translateX('+(100*d)+'%)'},{transform:'none'}],op);
  a1.onfinish=function(){o.remove()};swUpd()}
function swUpd(){var L=swList(),one=L.length<2;var lb=document.querySelector('#twin .tlb:last-child');if(lb&&!lb.getAnimations().length)lb.innerHTML=swLbHtml(cur);
  [].forEach.call(SW.querySelectorAll('.tar'),function(b){b.hidden=one;var t=swNb(+b.dataset.dir);b.title=t?NM[t][0]:(+b.dataset.dir>0?'Это последний раздел':'Это первый раздел');b.setAttribute('aria-label',t?'Перейти: '+NM[t][0]:b.title);b.querySelector('.obc').textContent=(!one&&t==='obr')?obCnt:''});
  document.getElementById('tdots').innerHTML=one?'':L.map(function(k){return '<i class="'+(k===cur?'on':'')+'"></i>'}).join('')}
SW.addEventListener('click',function(e){var b=e.target.closest('.tar');if(!b)return;var d=+b.dataset.dir,t=swNb(d);if(t){showTab(t,d);return}swEdge(d,b)});
/* упор на крайнем разделе: стрелка вспыхивает красным, название и страница упруго толкаются в сторону нажатия */
function swEdge(d,b){var red=false;try{red=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}if(!b.animate)return;
  b.animate([{borderColor:'var(--danger)',color:'var(--danger)',boxShadow:'0 0 0 3px rgba(248,113,113,.25)'},{borderColor:'var(--bd)',color:'var(--tx)',boxShadow:'0 0 0 0 transparent'}],{duration:600,easing:'ease-out'});
  if(red||ANI.some(function(a){return a.playState==='running'}))return;
  var o={duration:420,easing:'cubic-bezier(.3,1.6,.5,1)'},lb=document.querySelector('#twin .tlb:last-child'),f=document.getElementById(TABS[cur].f);
  if(lb)lb.animate([{transform:'none'},{transform:'translateX('+(-14*d)+'%)'},{transform:'none'}],o);

/* ставим переключатель точно на место-заготовку открытой страницы; прячем, если её закрывает окно, отчёт или экран входа */

  SW.hidden=!ok;if(ok){SW.style.left=r.left+'px';SW.style.top=r.top+'px'}}
